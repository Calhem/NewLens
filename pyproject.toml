[project]
name = "newslens"
version = "0.0.1"
description = "Open-source, self-hostable tool for critically examining news reporting, on TypeDB"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "typedb-driver==3.14.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.11",
    "uvicorn>=0.54.0",
    "trafilatura>=2.3.1",
    "protego>=0.7.0",
    "defusedxml>=0.7.1",
    "httpcore==1.0.*",
    "anthropic>=2.3.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
# Deprecation warnings fail the tests so they get fixed promptly; the SyntaxWarning is
# harmless and comes from inside typedb-driver 3.14.0's own code.
filterwarnings = ["error::DeprecationWarning", "ignore::SyntaxWarning"]
